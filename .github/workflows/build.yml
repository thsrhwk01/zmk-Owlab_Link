name: Build and Release ZMK firmware

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "boards/**"
      - "config/**"
      - "zephyr/**"
      - "build.yaml"
      - ".github/workflows/build.yml"
  push:
    branches:
      - "**"
    tags:
      - "v*.*"
    paths:
      - "boards/**"
      - "config/**"
      - "zephyr/**"
      - "build.yaml"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0

  release:
    name: Publish firmware release
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download built firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: artifacts

      - name: Verify firmware and write checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from struct import unpack_from

          path = Path("artifacts/owlab_link_hotswap-zmk.bin")
          image = path.read_bytes()

          if len(image) > 0x1A000:
              raise SystemExit(
                  f"firmware is {len(image)} bytes; LINK65 code partition is 0x1A000 bytes"
              )

          initial_msp, reset_handler = unpack_from("<II", image)
          if initial_msp & 0x2FFFB000 != 0x20000000:
              raise SystemExit(
                  f"initial MSP 0x{initial_msp:08X} is rejected by the factory bootloader"
              )

          reset_address = reset_handler & ~1
          if reset_handler & 1 == 0 or not 0x08006000 <= reset_address < 0x08020000:
              raise SystemExit(f"invalid Reset Handler 0x{reset_handler:08X}")

          digest = sha256(image).hexdigest().upper()
          Path("artifacts/SHA256SUMS.txt").write_text(
              f"{digest}  {path.name}\n", encoding="ascii"
          )
          print(f"size={len(image)}")
          print(f"initial_msp=0x{initial_msp:08X}")
          print(f"reset_handler=0x{reset_handler:08X}")
          print(f"sha256={digest}")
          PY

      - name: Determine release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            name="Release ${tag}"
            if [[ "${version}" =~ [a-zA-Z] ]]; then
              prerelease="true"
              make_latest="false"
            else
              prerelease="false"
              make_latest="true"
            fi
          else
            short_sha="${GITHUB_SHA::7}"
            tag="build-${GITHUB_RUN_NUMBER}-${short_sha}"
            name="Automatic build #${GITHUB_RUN_NUMBER} (${short_sha})"
            prerelease="false"
            make_latest="true"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "make_latest=${make_latest}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: |
            artifacts/owlab_link_hotswap-zmk.bin
            artifacts/SHA256SUMS.txt
          body: |
            Automated ZMK firmware for the Owlab LINK65 hotswap PCB.

            Source commit: `${{ github.sha }}`

            Flash `owlab_link_hotswap-zmk.bin` at `0x08006000`. Do not mass-erase
            the MCU or overwrite the factory bootloader. Read the repository
            README before flashing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

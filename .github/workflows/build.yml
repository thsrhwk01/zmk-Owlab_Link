name: Build and Release ZMK firmware

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "boards/**"
      - "config/**"
      - "zephyr/**"
      - "build.yaml"
      - "tools/windows-flasher/**"
      - ".github/workflows/build.yml"
  push:
    branches:
      - "**"
    tags:
      - "v*.*"
    paths:
      - "boards/**"
      - "config/**"
      - "zephyr/**"
      - "build.yaml"
      - "tools/windows-flasher/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@edf5c0814fd3ea202e43aad2d68fd32e882a518c # v0.3.0

  package:
    name: Package Windows flasher
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out flasher files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download built firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware
          path: artifacts

      - name: Verify firmware image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack_from

          path = Path("artifacts/owlab_link_hotswap-zmk.bin")
          image = path.read_bytes()

          if len(image) > 0x1A000:
              raise SystemExit(
                  f"firmware is {len(image)} bytes; LINK65 code partition is 0x1A000 bytes"
              )

          initial_msp, reset_handler = unpack_from("<II", image)
          if initial_msp & 0x2FFFB000 != 0x20000000:
              raise SystemExit(
                  f"initial MSP 0x{initial_msp:08X} is rejected by the factory bootloader"
              )

          reset_address = reset_handler & ~1
          if reset_handler & 1 == 0 or not 0x08006000 <= reset_address < 0x08020000:
              raise SystemExit(f"invalid Reset Handler 0x{reset_handler:08X}")

          print(f"size={len(image)}")
          print(f"initial_msp=0x{initial_msp:08X}")
          print(f"reset_handler=0x{reset_handler:08X}")
          PY

      - name: Download verified dfu-util distribution
        shell: bash
        env:
          DFU_UTIL_BIN_SHA256: 6450de30a7dcd8d8c1273f43f0b153f054fd24d85f7f38296b1ad8edbd2ddb25
          DFU_UTIL_SRC_SHA256: b4b53ba21a82ef7e3d4c47df2952adf5fa494f499b6b0b57c58c5d04ae8ff19e
          LIBUSB_SRC_SHA256: 9c95417c6dfafa883798fa8f6a0f726581573952c2293fa7b6c4252f38afbc37
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 \
            --output dfu-util-0.11-binaries.tar.xz \
            https://downloads.sourceforge.net/project/dfu-util/dfu-util-0.11-binaries.tar.xz
          curl --location --fail --retry 3 \
            --output dfu-util-0.11.tar.gz \
            https://downloads.sourceforge.net/project/dfu-util/dfu-util-0.11.tar.gz
          curl --location --fail --retry 3 \
            --output libusb-1a906274a66dd58bf81836db1306902d4a7dc185.tar.gz \
            https://codeload.github.com/libusb/libusb/tar.gz/1a906274a66dd58bf81836db1306902d4a7dc185
          echo "${DFU_UTIL_BIN_SHA256}  dfu-util-0.11-binaries.tar.xz" | sha256sum --check --strict
          echo "${DFU_UTIL_SRC_SHA256}  dfu-util-0.11.tar.gz" | sha256sum --check --strict
          echo "${LIBUSB_SRC_SHA256}  libusb-1a906274a66dd58bf81836db1306902d4a7dc185.tar.gz" | sha256sum --check --strict
          tar -xJf dfu-util-0.11-binaries.tar.xz

      - name: Assemble flasher bundle
        shell: bash
        run: |
          set -euo pipefail
          package_root="package/LINK65-ZMK-Windows"
          third_party="${package_root}/third-party/dfu-util"
          mkdir -p "${third_party}"

          cp artifacts/owlab_link_hotswap-zmk.bin "${package_root}/"
          cp tools/windows-flasher/flash-link65.cmd "${package_root}/"
          cp tools/windows-flasher/flash-link65.ps1 "${package_root}/"
          cp tools/windows-flasher/README_KO.txt "${package_root}/"
          cp tools/windows-flasher/THIRD-PARTY-NOTICES.txt "${package_root}/"
          cp dfu-util-0.11-binaries/win64/dfu-util.exe "${package_root}/"
          cp dfu-util-0.11-binaries/win64/libusb-1.0.dll "${package_root}/"
          cp dfu-util-0.11-binaries/COPYING "${third_party}/COPYING.txt"
          cp dfu-util-0.11-binaries/README-bin.txt "${third_party}/"
          cp dfu-util-0.11.tar.gz "${third_party}/"
          cp libusb-1a906274a66dd58bf81836db1306902d4a7dc185.tar.gz "${third_party}/"

          printf 'Source commit: %s\nActions run: %s\n' \
            "${GITHUB_SHA}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${package_root}/BUILD-INFO.txt"

          (
            cd "${package_root}"
            sha256sum \
              owlab_link_hotswap-zmk.bin \
              dfu-util.exe \
              libusb-1.0.dll \
              > SHA256SUMS.txt
          )

      - name: Upload one-click Windows flasher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LINK65-ZMK-Windows
          path: package/LINK65-ZMK-Windows
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

  release:
    name: Publish firmware release
    needs: package
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download built firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware
          path: artifacts

      - name: Download Windows flasher files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LINK65-ZMK-Windows
          path: flasher

      - name: Create release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          (
            cd flasher
            zip -9 -r ../release/LINK65-ZMK-Windows.zip .
          )
          cp artifacts/owlab_link_hotswap-zmk.bin release/
          (
            cd release
            sha256sum LINK65-ZMK-Windows.zip owlab_link_hotswap-zmk.bin > SHA256SUMS.txt
          )

      - name: Determine release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          name="Release ${tag}"
          if [[ "${version}" =~ [a-zA-Z] ]]; then
            prerelease="true"
            make_latest="false"
          else
            prerelease="false"
            make_latest="true"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "make_latest=${make_latest}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: |
            release/LINK65-ZMK-Windows.zip
            release/owlab_link_hotswap-zmk.bin
            release/SHA256SUMS.txt
          body: |
            Automated ZMK firmware for the Owlab LINK65 hotswap PCB.

            Source commit: `${{ github.sha }}`

            Windows users can download `LINK65-ZMK-Windows.zip`, extract every
            file, and run `flash-link65.cmd`. Manual flashing remains available
            with `owlab_link_hotswap-zmk.bin` at `0x08006000`.

            Do not mass-erase the MCU or overwrite the factory bootloader. Read
            the repository README before flashing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
